name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
          extensions: pcntl

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-14 shellcheck

      - name: Run verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint_${version}_linux_amd64.tar.gz"
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Install PHP quality dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run ShellCheck, PHP syntax, style, and static analysis
        shell: bash
        run: |
          set -euo pipefail
          find tools -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
          find tests examples tools -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          php -l resvg.stub.php
          vendor/bin/phpcs
          vendor/bin/phpstan analyse --memory-limit=512M
          find . -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' \) ! -name resvg_arginfo.h -print0 | xargs -0 -r clang-format-14 --dry-run --Werror

      - name: Verify resvg_arginfo.h matches resvg.stub.php (arginfo drift gate)
        shell: bash
        run: |
          set -euo pipefail
          php tools/gen_stub.php resvg.stub.php
          git diff --exit-code resvg_arginfo.h

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-quality
          add-job-id-key: false
          workspaces: native

      - name: Run Rust static gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/Cargo.toml -- --check
          cargo clippy --manifest-path native/Cargo.toml -- -D warnings

      - name: Prove offline resolution is complete (cargo vendor + frozen check)
        shell: bash
        run: |
          set -euo pipefail
          tools/vendor-offline.sh
          (cd native && cargo check --frozen --quiet)
          rm -rf native/vendor-crates native/.cargo

  build:
    name: Build and gate PHP ${{ matrix.php }} (${{ matrix.arch }}, glibc)
    needs: [quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.4'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.5'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.3'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.4'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.5'
            arch: aarch64
            os: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # The pinned source must exist before the cache restore: rust-cache
      # treats it as a workspace and errors (restoring nothing) otherwise.
      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-el8-${{ matrix.arch }}
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      # The glibc release artifacts are built on AlmaLinux 8 (glibc 2.28 floor);
      # CI builds in the identical environment so it tests what ships.
      - name: Build and gate inside almalinux:8
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src \
            -e GITHUB_SHA -e GITHUB_RUN_ID \
            almalinux:8 bash -c '
              set -eu
              tools/build-el8.sh ${{ matrix.php }}
              sha256="$(sha256sum build/resvg-php${{ matrix.php }}.so | awk "{print \$1}")"
              api="$(awk "\$1 == \"#define\" && \$2 == \"ZEND_MODULE_API_NO\" { print \$3; exit }" \
                "$(php-config --include-dir)/Zend/zend_modules.h")"
              printf "commit=%s\nrun_id=%s\nphp=%s\nphp_api=%s\narch=%s\nsha256=%s\n" \
                "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ matrix.php }}" "$api" "$(uname -m)" "$sha256" \
                > "build/resvg-php${{ matrix.php }}-${{ matrix.arch }}.provenance"
            '

      - name: Upload tested artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: resvg-tested-php${{ matrix.php }}-${{ matrix.arch }}
          path: |
            build/resvg-php${{ matrix.php }}.so
            build/resvg-php${{ matrix.php }}-${{ matrix.arch }}.provenance
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Build and gate PHP 8.3 (macOS arm64)
    needs: [quality]
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
          extensions: pcntl

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-darwin-arm64
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      - name: Build the extension and run the fidelity gate
        run: tools/build.sh 8.3

      - name: Run the test suite
        run: php tools/test-phpt.php build/resvg-php8.3.so

      - name: Run the examples
        run: tools/test-examples.sh build/resvg-php8.3.so

  build-musl:
    name: Build and gate PHP 8.3 (musl x86_64)
    needs: [quality]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-musl-x86_64
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      # Explicit docker step rather than a job-level container, matching the
      # release musl jobs: one pattern on every runner architecture.
      - name: Build and gate inside php:8.3-alpine
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src php:8.3-alpine sh -c '
            set -eu
            apk add --no-cache bash gcc make musl-dev binutils autoconf curl git ca-certificates ttf-dejavu
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1 >/dev/null 2>&1
            export PATH="$HOME/.cargo/bin:$PATH"
            tools/fetch-resvg.sh >/dev/null
            tools/build.sh 8.3
            php tools/test-phpt.php build/resvg-php8.3.so
            tools/test-examples.sh build/resvg-php8.3.so
          '

  build-zts:
    name: Build and gate PHP 8.3 (ZTS x86_64)
    needs: [quality]
    runs-on: ubuntu-22.04
    container:
      image: php:8.3-zts
    steps:
      - name: Install build dependencies
        run: apt-get update -qq && apt-get install -y -qq gcc make autoconf binutils curl ca-certificates valgrind fonts-dejavu-core

      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-zts-x86_64
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      - name: Build the extension and run the fidelity gate
        run: tools/build.sh 8.3

      - name: Verify the module reports ZTS
        run: php -n -d extension=build/resvg-php8.3.so --ri resvg | grep -q 'enabled (ZTS)'

      - name: Run the test suite
        run: php tools/test-phpt.php build/resvg-php8.3.so

      - name: Run the examples
        run: tools/test-examples.sh build/resvg-php8.3.so

      - name: Run the multi-threaded race and leak gate
        run: tools/test-zts.sh

  build-windows:
    name: Build and gate PHP ${{ matrix.php }} (Windows x64)
    needs: [quality]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # PHP's Windows configure requires bison, re2c, and sed on PATH even
      # for extension-only builds; MSYS2 provides all three at the location
      # tools/build-windows.ps1 checks.
      - name: Provision bison, re2c, and sed via MSYS2
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MSYS
          update: false
          release: false
          install: bison re2c

      - name: Activate the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # PHP's official Windows builds ship with the VS17 toolset; PHP
          # refuses modules linked with a newer toolset than its own core.
          vsversion: 17.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      # The pinned source must exist before the cache restore: rust-cache
      # treats it as a workspace and errors (restoring nothing) otherwise.
      - name: Fetch the pinned resvg source
        run: bash tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-windows-x64
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      - name: Parse-check the build script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/tools/build-windows.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host "parse: $($_.Message)" }; exit 1 }
          Write-Host 'PowerShell parse OK'

      - name: Build, gate, and validate the PE artifact
        shell: pwsh
        run: tools/build-windows.ps1 -PhpVersion ${{ matrix.php }}

  memory:
    name: Valgrind memory gate (PHP 8.3)
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-el8-x86_64
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      - name: Build and run the Valgrind memory gate inside almalinux:8
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src almalinux:8 bash -c '
            set -eu
            tools/build-el8.sh 8.3
            dnf -q install -y valgrind >/dev/null
            tools/test-memory.sh build/resvg-php8.3.so
          '

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
          extensions: pcntl

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-14 shellcheck

      - name: Run verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint_${version}_linux_amd64.tar.gz"
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Install PHP quality dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run ShellCheck, PHP syntax, style, and static analysis
        shell: bash
        run: |
          set -euo pipefail
          find tools -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
          find tests examples tools -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          php -l resvg.stub.php
          vendor/bin/phpcs
          vendor/bin/phpstan analyse --memory-limit=512M
          find . -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' \) ! -name resvg_arginfo.h -print0 | xargs -0 -r clang-format-14 --dry-run --Werror

      - name: Verify resvg_arginfo.h matches resvg.stub.php (arginfo drift gate)
        shell: bash
        run: |
          set -euo pipefail
          php tools/gen_stub.php resvg.stub.php
          git diff --exit-code resvg_arginfo.h

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-quality
          add-job-id-key: false
          workspaces: native

      - name: Run Rust static gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/Cargo.toml -- --check
          cargo clippy --manifest-path native/Cargo.toml -- -D warnings

  build:
    name: Build and gate PHP ${{ matrix.php }} (${{ matrix.arch }})
    needs: [quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.4'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.5'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.3'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.4'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.5'
            arch: aarch64
            os: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
          extensions: pcntl

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-${{ matrix.arch }}
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y curl binutils

      - name: Build the extension and run the fidelity gate
        run: PHP_VERSION=${{ matrix.php }} tools/build.sh ${{ matrix.php }}

      - name: Run the test suite
        run: php tools/test-phpt.php build/resvg-php${{ matrix.php }}.so

      - name: Run the examples
        run: tools/test-examples.sh build/resvg-php${{ matrix.php }}.so

      - name: Record artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          artifact=build/resvg-php${{ matrix.php }}.so
          sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          api="$(php-config${{ matrix.php }} --phpapi)"
          arch="$(uname -m)"
          printf 'commit=%s\nrun_id=%s\nphp=%s\nphp_api=%s\narch=%s\nsha256=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ matrix.php }}" "$api" "$arch" "$sha256" \
            > "build/resvg-php${{ matrix.php }}-${{ matrix.arch }}.provenance"

      - name: Upload tested artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: resvg-tested-php${{ matrix.php }}-${{ matrix.arch }}
          path: |
            build/resvg-php${{ matrix.php }}.so
            build/resvg-php${{ matrix.php }}-${{ matrix.arch }}.provenance
          if-no-files-found: error
          retention-days: 3

  memory:
    name: Valgrind memory gate (PHP 8.3)
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
          extensions: pcntl

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-x86_64
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y curl binutils valgrind

      - name: Build the extension and run the fidelity gate
        run: PHP_VERSION=8.3 tools/build.sh 8.3

      - name: Run the Valgrind memory gate
        run: tools/test-memory.sh build/resvg-php8.3.so

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build PHP ${{ matrix.php }} (${{ matrix.arch }}, glibc)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.4'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.5'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.3'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.4'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.5'
            arch: aarch64
            os: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # The pinned source must exist before the cache restore: rust-cache
      # treats it as a workspace and errors (restoring nothing) otherwise.
      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-el8-${{ matrix.arch }}
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      # glibc artifacts build on AlmaLinux 8 (glibc 2.28) so the prebuilts load
      # across RHEL/Alma/Rocky 8, Debian 10+, Ubuntu 20.04+, and Amazon Linux
      # 2023. GLIBC_FLOOR makes the imported-symbol ceiling a hard gate.
      - name: Build, gate, and package PHP ${{ matrix.php }} (glibc 2.28)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src \
            -e ABIS=${{ matrix.php }} -e RELEASE_TAG="$RELEASE_TAG" -e GLIBC_FLOOR=2.28 \
            -e GIT_REV="$GITHUB_SHA" -e RESVG_EL8_SKIP_TESTS=1 \
            almalinux:8 bash -c '
              set -eu
              tools/build-el8.sh ${{ matrix.php }}
              ABIS=${{ matrix.php }} RELEASE_TAG="$RELEASE_TAG" GLIBC_FLOOR=2.28 tools/release-build.sh
            '

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-php${{ matrix.php }}-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 3

  build-musl:
    name: Build PHP ${{ matrix.php }} musl (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.4'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.5'
            arch: x86_64
            os: ubuntu-22.04
          - php: '8.3'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.4'
            arch: aarch64
            os: ubuntu-22.04-arm
          - php: '8.5'
            arch: aarch64
            os: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-musl-${{ matrix.arch }}
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      # The Alpine environment runs through an explicit docker step rather than
      # a job-level container: GitHub cannot execute node-based actions inside
      # containers on arm64 runners, and checkout/artifact upload must stay on
      # the host.
      - name: Build, gate, and package PHP ${{ matrix.php }} (musl)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src "php:${{ matrix.php }}-alpine" sh -c '
            set -eu
            apk add --no-cache bash gcc make musl-dev binutils autoconf curl git ca-certificates zip ttf-dejavu
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1 >/dev/null 2>&1
            export PATH="$HOME/.cargo/bin:$PATH"
            tools/fetch-resvg.sh >/dev/null
            ABIS=${{ matrix.php }} RELEASE_TAG="$RELEASE_TAG" tools/release-build.sh
          '

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-php${{ matrix.php }}-musl-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Build PHP ${{ matrix.php }} (macOS arm64)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
          extensions: pcntl

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-darwin-arm64
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      - name: Build, gate, and package PHP ${{ matrix.php }} (macOS)
        env:
          ABIS: ${{ matrix.php }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: tools/release-build.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-php${{ matrix.php }}-darwin-arm64
          path: build/dist/*
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build PHP ${{ matrix.php }} (Windows x64)
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Activate the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch the pinned resvg source
        run: bash tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-build-windows-x64
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      - name: Build, gate, and package PHP ${{ matrix.php }} (Windows)
        shell: pwsh
        run: tools/build-windows.ps1 -PhpVersion ${{ matrix.php }} -Package -ReleaseTag "${{ github.ref_name }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-php${{ matrix.php }}-windows-x86_64
          path: build/dist/*
          if-no-files-found: error
          retention-days: 3

  build-rpm:
    name: RPM (PHP ${{ matrix.php }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', arch: x86_64, os: ubuntu-22.04 }
          - { php: '8.4', arch: x86_64, os: ubuntu-22.04 }
          - { php: '8.5', arch: x86_64, os: ubuntu-22.04 }
          - { php: '8.3', arch: aarch64, os: ubuntu-22.04-arm }
          - { php: '8.4', arch: aarch64, os: ubuntu-22.04-arm }
          - { php: '8.5', arch: aarch64, os: ubuntu-22.04-arm }
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-rpm-${{ matrix.arch }}
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      # The rpm builds the extension inside rpmbuild through the canonical
      # phpize path, from the offline bundle. config.m4 falls back to
      # ~/.cargo/bin for the MSRV toolchain, which the EL8 rust rpm cannot
      # provide (resvg needs >= 1.85). The gate runs against the installed
      # module, so the packaged bytes are the verified bytes.
      - name: Build and gate the RPM
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src almalinux:8 bash -c '
            set -eu
            export PATH="$HOME/.cargo/bin:$PATH"
            dnf -q install -y epel-release >/dev/null
            dnf -q install -y "https://rpms.remirepo.net/enterprise/remi-release-8.rpm" >/dev/null
            dnf -q module reset php -y >/dev/null 2>&1 || true
            dnf -q module enable "php:remi-${{ matrix.php }}" -y >/dev/null
            dnf -q install -y php php-devel gcc gcc-c++ make git curl diffutils \
              dejavu-sans-fonts rpm-build >/dev/null
            command -v cargo >/dev/null 2>&1 || \
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
                --default-toolchain 1.98.1 >/dev/null
            tools/build-packages.sh ${{ matrix.php }} rpm
            rpmfile="$(realpath "$(ls build/dist/php-pecl-resvg-[0-9]*.${{ matrix.arch }}.rpm)")"
            dnf -q install -y "$rpmfile" >/dev/null
            php -r "exit(extension_loaded(\"resvg\") ? 0 : 1);"
            php -r "echo Resvg\Renderer::version(), PHP_EOL;"
            PHP_VERSION=${{ matrix.php }} tools/test-fidelity.sh /usr/lib64/php/modules/resvg.so
            PHP_VERSION=${{ matrix.php }} php tools/test-phpt.php /usr/lib64/php/modules/resvg.so
            PHP_VERSION=${{ matrix.php }} tools/test-examples.sh /usr/lib64/php/modules/resvg.so
          '

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-rpm-php${{ matrix.php }}-${{ matrix.arch }}
          path: build/dist/php-pecl-resvg-*
          if-no-files-found: error
          retention-days: 3

  build-deb:
    name: deb (PHP ${{ matrix.php }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', arch: x86_64, os: ubuntu-22.04 }
          - { php: '8.4', arch: x86_64, os: ubuntu-22.04 }
          - { php: '8.5', arch: x86_64, os: ubuntu-22.04 }
          - { php: '8.3', arch: aarch64, os: ubuntu-22.04-arm }
          - { php: '8.4', arch: aarch64, os: ubuntu-22.04-arm }
          - { php: '8.5', arch: aarch64, os: ubuntu-22.04-arm }
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Fetch the pinned resvg source
        run: tools/fetch-resvg.sh

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: resvg-deb-${{ matrix.arch }}
          add-job-id-key: false
          workspaces: |
            native
            vendor-src/resvg-0.48.1

      # Ubuntu 24.04 carries PHP 8.3 natively; 8.4/8.5 come from the Ondrej PPA,
      # the same source Ubuntu PHP users take newer ABIs from. The module is
      # built through phpize from the offline bundle, installed from the deb,
      # and gated where it actually lands.
      - name: Build and gate the deb
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src "ubuntu:24.04" bash -c '
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq software-properties-common >/dev/null
            add-apt-repository -y ppa:ondrej/php >/dev/null
            apt-get update -qq >/dev/null
            apt-get install -y -qq php${{ matrix.php }}-cli php${{ matrix.php }}-dev \
              build-essential git curl ca-certificates pkg-config m4 \
              fonts-dejavu-core >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
              --default-toolchain 1.98.1 >/dev/null
            export PATH="$HOME/.cargo/bin:$PATH"
            tools/build-packages.sh ${{ matrix.php }} deb
            # apt reads a bare relative path as a package name; realpath makes
            # it an unambiguous local file.
            debfile="$(realpath "$(ls build/dist/php${{ matrix.php }}-resvg_*.deb)")"
            apt-get install -y -qq "$debfile" >/dev/null
            php${{ matrix.php }} -r "exit(extension_loaded(\"resvg\") ? 0 : 1);"
            php${{ matrix.php }} -r "echo Resvg\Renderer::version(), PHP_EOL;"
            module="$(php-config${{ matrix.php }} --extension-dir)/resvg.so"
            PHP_VERSION=${{ matrix.php }} tools/test-fidelity.sh "$module"
            PHP_VERSION=${{ matrix.php }} php${{ matrix.php }} tools/test-phpt.php "$module"
            PHP_VERSION=${{ matrix.php }} tools/test-examples.sh "$module"
          '

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-deb-php${{ matrix.php }}-${{ matrix.arch }}
          path: build/dist/php*-resvg_*
          if-no-files-found: error
          retention-days: 3

  offline-bundle:
    name: Build offline source bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
          extensions: pcntl

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Build the offline source bundle
        env:
          OUT_DIR: build/dist
        run: tools/vendor-offline.sh --tarball

      - name: Prove the bundle builds offline from a fresh extraction
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/offline-proof"
          mkdir -p "$extract"
          tar -xzf build/dist/resvg-php-*-offline.tar.gz -C "$extract"
          cd "$extract"/resvg-php-*-offline
          # An isolated CARGO_HOME empties the registry cache, so this can only
          # resolve through the bundle's own vendored crates — without it, the
          # host cache this job warmed earlier silently fakes the proof.
          OFFLINE=1 SKIP_GATE=1 CARGO_HOME="$RUNNER_TEMP/cargo-home" tools/build.sh 8.3

      - name: Upload the offline bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-offline
          path: build/dist/*
          if-no-files-found: error
          retention-days: 3

  finalize:
    name: Assemble and publish release
    needs: [build, build-musl, build-macos, build-windows, build-rpm, build-deb, offline-bundle]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    env:
      SYFT_VERSION: '1.52.0'
      SYFT_SHA256: 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d'
      COSIGN_VERSION: '3.1.3'
      COSIGN_SHA256: '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71'
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download built assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: build/dist

      - name: Verify tag provenance, version lockstep, and rolled CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="${tag#v}"
          ext_version="$(awk -F'"' '/#define PHP_RESVG_VERSION/ {print $2}' php_resvg.h)"
          if [ "$base" != "$ext_version" ]; then
            echo "FAIL: tag $tag base version '$base' != PHP_RESVG_VERSION '$ext_version'" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "FAIL: tag $tag is not on main" >&2
            exit 1
          fi
          if ! grep -qE "^## \[$base\]" CHANGELOG.md; then
            echo "FAIL: CHANGELOG.md has no '## [$base]' section; roll [Unreleased] first" >&2
            exit 1
          fi
          printf 'RELEASE_BASE=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Generate the SBOM (syft, pinned)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_SHA256" "$archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" dir:build/dist --source-name resvg-php --source-version "$RELEASE_BASE" -o spdx-json > /tmp/sbom.spdx.json
          mv /tmp/sbom.spdx.json "build/dist/resvg-php-${RELEASE_BASE}-sbom.spdx.json"

      - name: Regenerate SHA256SUMS over all assets
        shell: bash
        run: |
          set -euo pipefail
          cd build/dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print | sort | xargs sha256sum > /tmp/rsp-release-sums.tmp
          mv /tmp/rsp-release-sums.tmp SHA256SUMS

      - name: Install cosign (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          printf '%s  %s\n' "$COSIGN_SHA256" "$RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"

      - name: Sign every release asset (cosign keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd build/dist
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "SHA256SUMS" ] && continue
            "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "$f.bundle" "$f"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "resvg-php $GITHUB_REF_NAME" \
            --notes "Static per-ABI builds of the resvg extension. See CHANGELOG.md for this release's changes; verify assets with SHA256SUMS and the cosign bundles." \
            build/dist/*

[package]
name = "resvg-php-shim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "resvg_php"
crate-type = ["staticlib"]

[dependencies]
resvg = { path = "../vendor-src/resvg-0.48.1/crates/resvg", default-features = false, features = [
    "svgz",
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
] }
usvg = { path = "../vendor-src/resvg-0.48.1/crates/usvg", default-features = false, features = [
    "svgz",
    "text",
    "system-fonts",
    "memmap-fonts",
    "writer",
] }
svgtypes = "0.16.1"
tiny-skia = "0.12.0"
# Mirrors usvg's own format sniffing in the confinement resolver; pinned to the
# version already resolved in Cargo.lock.
imagesize = "0.15.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
